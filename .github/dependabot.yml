version: 2

updates:

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "terraform"
    directories:
      - "/bootstrap"
      - "/log-archive"
      - "/management-account"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"